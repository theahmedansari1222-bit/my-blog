name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn' # npm کی جگہ yarn کر دیا گیا ہے

      - name: Install Dependencies
        run: yarn install # npm ci کی جگہ yarn install

      - name: Build Project
        env:
          VITE_SUPABASE_URL: https://supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_PZCnEgOZIm7H_8lOtzvT7A_2RQ0nhEQ
          VITE_SUPABASE_KEY: sb_publishable_PZCnEgOZIm7H_8lOtzvT7A_2RQ0nhEQ
        run: yarn build # npm run build کی جگہ yarn build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages