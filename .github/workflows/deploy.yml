name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # آپ کی ریپوزیٹری کی ڈیفالٹ برانچ 'main' ہی ہے

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Project
        env:
          VITE_SUPABASE_URL: https://xqdmduepioiympjbzobp.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_PZCnEgOZIm7H_8lOtzvT7A_2RQ0nhEQ
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite بلڈ فولڈر
          branch: gh-pages # یہ ایکشن خود بخود اس برانچ پر پبلش کر دے گا